    <script>
        function updateClock() {
            const now = new Date();

            const formatter = new Intl.DateTimeFormat('en-US', {
                timeZone: 'Asia/Jakarta',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            });

            const parts = formatter.formatToParts(now);
            const hours = parseInt(parts.find(p => p.type === 'hour').value);
            const minutes = parseInt(parts.find(p => p.type === 'minute').value);
            const seconds = parseInt(parts.find(p => p.type === 'second').value);

            const secondDeg = seconds * 6 - 90;
            const minuteDeg = minutes * 6 + seconds * 0.1 - 90;
            const hourDeg = (hours % 12) * 30 + minutes * 0.5 - 90;

            document.getElementById('second').style.transform = `rotate(${secondDeg}deg)`;
            document.getElementById('minute').style.transform = `rotate(${minuteDeg}deg)`;
            document.getElementById('hour').style.transform = `rotate(${hourDeg}deg)`;
        }

        // Force immediate update on page load before any rendering
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', updateClock);
        } else {
            updateClock();
        }
        setInterval(updateClock, 1000);
    </script>
